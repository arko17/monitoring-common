# Monitoring the monitoring: is the pipeline itself healthy?
groups:
  - name: meta
    interval: 1m
    rules:
      # Always firing. Alertmanager sends it to healthchecks.io as a dead man's switch.
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Alerting pipeline heartbeat"

      # Short retries (hub restart, network blip) are normal: vmagent buffers and resends.
      # Alert only when nothing gets through for 20 min, or a real backlog builds up.
      - alert: VmagentRemoteWriteFailing
        expr: |
          sum by (site, url) (rate(vmagent_remotewrite_requests_total{status_code="2XX"}[10m])) == 0
          or sum by (site, url) (vmagent_remotewrite_pending_data_bytes) > 100e6
        for: 20m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}: vmagent cannot deliver its data ({{ $labels.url }}) for 20 minutes, buffering on disk"

      - alert: MonitoringComponentDown
        expr: up{job=~"victoriametrics|vmagent|vmalert|alertmanager|grafana|blackbox|matrix-receiver"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}: monitoring component {{ $labels.job }} is down"

      - alert: AutomationJobStale
        # Written by the monitoring-update / monitoring-ansible timers through the textfile collector.
        expr: time() - monitoring_job_last_success_timestamp_seconds > 8 * 86400
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}: job {{ $labels.job_name }} has not succeeded for 8 days"
