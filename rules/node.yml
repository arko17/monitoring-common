# Host alerts for servers (node_exporter). Workstations are excluded with role!="workstation".
groups:
  - name: node
    interval: 1m
    rules:
      - alert: HostDown
        expr: up{job=~"node|node-.*"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }} unreachable"
          description: "Scrape target {{ $labels.job }} has been down for 5 minutes."

      - alert: DiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|nsfs"}[6h], 24*3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: {{ $labels.mountpoint }} fills up within 24h"

      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|nsfs"}
            / node_filesystem_size_bytes < 0.10
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: {{ $labels.mountpoint }} has <10% free"

      - alert: MemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: <5% RAM available"

      - alert: OOMKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: OOM killer was active"

      - alert: SystemdUnitFailed
        # *-wait-online often fails harmlessly at boot (network came up late / no carrier on a spare NIC).
        expr: node_systemd_unit_state{state="failed", name!~"(NetworkManager|systemd-networkd)-wait-online\\.service"} == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: unit {{ $labels.name }} failed"

      - alert: MdRaidDegraded
        expr: node_md_disks{state="failed"} > 0 or (node_md_disks_required - node_md_disks{state="active"}) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: RAID {{ $labels.device }} degraded"

      - alert: ZfsPoolUnhealthy
        expr: node_zfs_zpool_state{state!="online"} > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: zpool {{ $labels.zpool }} is {{ $labels.state }}"

      - alert: ClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: clock offset {{ $value | humanizeDuration }}"

  # Not paging: shown in dashboards and the weekly digest.
  - name: node-maintenance
    interval: 15m
    rules:
      - alert: RebootRequired
        expr: node_reboot_required == 1
        for: 3d
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }} has needed a reboot for 3 days"
      - alert: SecurityUpdatesPending
        expr: apt_upgrades_pending{origin=~".*[Ss]ecurity.*"} > 0
        for: 3d
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: {{ $value }} security updates pending for 3 days"
