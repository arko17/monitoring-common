groups:
  - name: hardware
    interval: 5m
    rules:
      - alert: SmartUnhealthy
        expr: smartctl_device_smart_status == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: disk {{ $labels.device }} reports SMART FAILED"

      - alert: SmartReallocatedSectors
        expr: delta(smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable", attribute_value_type="raw"}[24h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: {{ $labels.device }} {{ $labels.attribute_name }} increasing"

      - alert: NvmeWearHigh
        expr: smartctl_device_percentage_used > 90
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: NVMe {{ $labels.device }} {{ $value }}% worn"

      - alert: DiskTemperatureHigh
        expr: smartctl_device_temperature{temperature_type="current"} > 60
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: {{ $labels.device }} at {{ $value }}°C"

      - alert: IpmiSensorCritical
        # Discrete "Entity Presence" sensors (backplane present yes/no) are no health values.
        expr: ipmi_sensor_state{type!~".*Presence.*"} == 2
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: IPMI sensor {{ $labels.name }} critical"

      - alert: SynologyVolumeDegraded
        # SYNOLOGY-RAID-MIB raidStatus: 1 = Normal, 11 = Degraded, 12 = Crashed
        expr: raidStatus != 1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: Synology RAID {{ $labels.raidName }} status {{ $value }}"

      - alert: SynologyDiskUnhealthy
        # SYNOLOGY-DISK-MIB diskStatus: 1 = Normal
        expr: diskStatus != 1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }}/{{ $labels.instance }}: Synology disk {{ $labels.diskID }} status {{ $value }}"
