# Shared site playbook. Each site repo's site.yml imports this file.
#   full run   : ansible-playbook -i inventory.yml site.yml
#   stack only : ansible-playbook -i inventory.yml site.yml --tags stack
- name: Exporters on servers
  hosts: servers
  become: true
  tags: [exporters]
  roles:
    - node_exporter
    - smartctl_exporter

- name: IPMI exporter on bare-metal servers
  hosts: bare_metal
  become: true
  tags: [exporters]
  roles: [ipmi_exporter]

- name: WireGuard metrics on WG endpoints
  hosts: wireguard_hosts
  become: true
  tags: [exporters]
  roles: [wireguard_metrics]

- name: Unattended upgrades on hypervisors and backup servers (no automatic reboot)
  hosts: pve_hosts:pbs_hosts
  become: true
  tags: [updates]
  roles: [unattended_upgrades]

- name: Beszel agent on Linux workstations
  hosts: workstations:&linux
  become: true
  tags: [agents]
  gather_facts: false
  # Workstations are often switched off: skip them cleanly instead of failing the weekly run.
  pre_tasks:
    - name: Reachable?
      ansible.builtin.ping:
      ignore_unreachable: true
      register: _ping
    - name: Skip switched-off workstation
      ansible.builtin.meta: end_host
      when: _ping.unreachable | default(false)
    - name: Gather facts
      ansible.builtin.setup:
  roles: [beszel_agent]

- name: Monitoring stack
  hosts: stack_host
  become: true
  tags: [stack]
  roles:
    - role: docker
      vars:
        docker_compose_dir: "{{ stack_dir | default('/opt/monitoring') }}"
    - monitoring_stack
    - automation
