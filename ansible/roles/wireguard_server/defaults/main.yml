# ---------------------------------------------------------------------------
# WireGuard server (wg-quick). Peers dial in; nothing else is routed or NATed.
# Used by the hub to reach services at home (e.g. Home Assistant) through a
# tunnel the home side opens, so no inbound ports are needed at home.
# ---------------------------------------------------------------------------
wireguard_server_interface: wg0
wireguard_server_address: ""          # e.g. 10.77.0.1/24
wireguard_server_port: 51820          # UDP, must be open in any cloud firewall
wireguard_server_private_key: ""      # vault
# Tunnel MTU; empty = wg-quick default (1420). Lower it when a peer sits behind DS-Lite or
# similar (path MTU < 1500): 1280 always fits.
wireguard_server_mtu: ""
# Let peers reach each other through the server (hub-and-spoke, e.g. phone -> HA).
# Adds a FORWARD accept for wg0 -> wg0 only (Docker's FORWARD policy is DROP); no NAT,
# no access to anything else on the host's networks.
wireguard_server_forward_between_peers: false
wireguard_server_peers: []
#  - {name: homeassistant, public_key: "...", allowed_ips: "10.77.0.2/32"}
