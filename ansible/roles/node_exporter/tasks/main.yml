- name: Map CPU architecture
  ansible.builtin.set_fact:
    _ne_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armv7'}[ansible_architecture] }}"

- name: Create system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check installed version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: _ne_installed
  changed_when: false
  failed_when: false

- name: Download and install node_exporter {{ node_exporter_version }}
  when: node_exporter_version not in (_ne_installed.stdout | default('') + _ne_installed.stderr | default(''))
  block:
    - name: Download release
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ _ne_arch }}.tar.gz"
        dest: /tmp
        remote_src: true
    - name: Install binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ _ne_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

- name: Textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    mode: "0755"

- name: Systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Enable node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: APT update metrics
  when: node_exporter_apt_metrics | bool
  block:
    - name: Install apt metrics script
      ansible.builtin.copy:
        src: apt-metrics.sh
        dest: /usr/local/bin/apt-metrics.sh
        mode: "0755"
    - name: Install apt metrics units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop: [apt-metrics.service, apt-metrics.timer]
    - name: Enable apt metrics timer
      ansible.builtin.systemd_service:
        name: apt-metrics.timer
        enabled: true
        state: started
        daemon_reload: true
